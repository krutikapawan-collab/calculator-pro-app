name: Build Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Create .env for build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build web app
        run: npm run build

      - name: Setup Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # ── Debug APK (for testing) ──────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Pro-APK
          path: android/app/build/outputs/apk/debug/*.apk

      # ── Signed Release AAB (for Play Store) ──────────────────
      # Requires these GitHub repository secrets:
      #   RELEASE_KEYSTORE_BASE64  — base64-encoded .keystore file
      #   RELEASE_STORE_PASSWORD   — keystore password
      #   RELEASE_KEY_ALIAS        — key alias name
      #   RELEASE_KEY_PASSWORD     — key password
      - name: Decode keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        working-directory: android/app
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build Release AAB
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Release AAB
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Pro-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Clean up keystore
        if: always()
        working-directory: android/app
        run: rm -f release.keystore
