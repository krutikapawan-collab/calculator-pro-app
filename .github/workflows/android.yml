name: Build Android AAB
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install Dependencies
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android
    - name: Build Web App
      run: |
        npm run build --if-present
        mkdir -p dist
        cp -r build/* dist/ 2>/dev/null || cp -r .next/* dist/ 2>/dev/null || cp -r out/* dist/ 2>/dev/null || true
        if [ ! -f "dist/index.html" ]; then cp index.html dist/ 2>/dev/null || true; fi
    - name: Initialize Capacitor Config
      run: |
        if [ ! -f "capacitor.config.json" ]; then
          npx cap init "Calculator Pro" "com.krutikapawan.calculatorpro" --web-dir=dist
        fi
    - name: Add Android Platform
      run: |
        npx cap add android || true
        npx cap sync android || true
    - name: Build App Bundle (AAB)
      run: |
        cd android || (npx cap add android && cd android)
        chmod +x gradlew
        ./gradlew bundleRelease || ./gradlew assembleRelease
    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: |
          android/app/build/outputs/bundle/release/
          android/app/build/outputs/apk/release/


