<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- App identity -->
    <title>Calculator 1+</title>
    <meta name="description" content="Calculator, GST Tax, Loan EMI, Currency Converter & Ledger Book — all in one free app." />

    <!-- PWA / install -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calculator 1+" />

    <!-- Theme colors -->
    <meta name="theme-color" content="#030810" />
    <meta name="msapplication-TileColor" content="#030810" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Social / OG -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Calculator 1+" />
    <meta property="og:description" content="Calculator, GST, EMI, Currency Converter & Ledger in one mobile app." />
    <meta property="og:image" content="/icon.svg" />
    <meta name="twitter:card" content="summary" />

    <!-- Splash screen bg on iOS -->
    <style>
      body { background: #030810; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
